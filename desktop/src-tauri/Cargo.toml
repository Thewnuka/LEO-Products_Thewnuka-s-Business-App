[package]
name = "leo-products-desktop"
version = "1.0.0"
description = "LEO PRODUCTS desktop app"
edition = "2021"

[lib]
name = "leo_products_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
