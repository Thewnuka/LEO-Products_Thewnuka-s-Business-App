{% comment %}Bar chart drawn as SVG from finance.charts.bar_chart(). Needs `chart` and `title`.{% endcomment %}
{% if chart %}
<figure class="leo-chart">
  <div class="leo-chart__scroll">
    <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" width="{{ chart.width }}" height="{{ chart.height }}" role="img" aria-label="{{ title }}">
      <title>{{ title }}</title>
      {% for g in chart.grid %}
        <line x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ g.y }}" y2="{{ g.y }}" class="leo-chart__grid"/>
        <text x="{{ chart.axis_x }}" y="{{ g.y }}" dy="3" text-anchor="end" class="leo-chart__axis">{{ g.value }}</text>
      {% endfor %}
      <line x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ chart.baseline }}" y2="{{ chart.baseline }}" class="leo-chart__base"/>
      {% for b in chart.bars %}<rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" class="leo-chart__bar leo-chart__bar--{{ b.css }}"><title>{{ b.title }}</title></rect>{% endfor %}
      {% for l in chart.labels %}<text x="{{ l.x }}" y="{{ chart.label_y }}" class="leo-chart__label" text-anchor="middle">{{ l.text }}</text>{% endfor %}
    </svg>
  </div>
  <figcaption class="leo-chart__legend">{% for name, css in chart.legend %}<span><i class="leo-chart__key leo-chart__bar--{{ css }}" aria-hidden="true"></i>{{ name }}</span>{% endfor %}
    <span class="text-body-secondary">(LKR)</span></figcaption>
</figure>
{% endif %}
